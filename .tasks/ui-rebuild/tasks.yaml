version: 1
area: ui
feature:
  title: "UI 重构：四栏外壳 + workbench 网格画布 + 受限 DSL widget"
  status: planning
  authority: "apps/app/ARCHITECTURE.md（UI 结构的唯一权威；本文件只登记任务与验收）"

tasks:
  # ───────────────────────── 阶段 1：地基 ─────────────────────────
  - id: UI-01
    title: "归档旧 UI 到 src/_legacy-ui 并隔离出构建"
    status: done
    goal: "把旧 UI（shell/composition/modules 外壳/样式/调色板）整体移入归档区，保证随时可回看，且不影响构建与类型检查。"
    scope:
      in:
        - "git mv 移入 src/_legacy-ui/：src/shell、src/composition、src/ui-registry.ts、src/modules（除下方例外）、src/shared/brand-showcase.tsx、src/management.tsx、src/management.css、src/styles.css、src/muse-theme.css、src/emo.ts"
        - "实施修正：themes/mindlink.css、themes/dark.css **暂不归档** —— export-theme.mjs 读 mindlink.css、theme-contract 也守这两个调色板，收编留到 UI-14"
        - "实施修正：src/modules/work-tree-model.ts **不归档**，移到 src/components/widgets/work-tree/（被 test/work-tree-model.test.mjs 覆盖的纯模型，属资产）"
        - "实施修正：apps/app/emo.json **不删** —— apps/desktop 三处跨包消费它（main.ts 的窗口标题/应用名/图标、scripts/prepare-emo-icon.mjs、electron-builder.yml），删除必须与桌面壳协同，不能算 UI 一处的事"
        - "实施修正：src/shared/brand-showcase.tsx 一并归档（唯一消费者是旧 shell，但它 import 已归档的 emo.ts，留着会断类型检查）"
        - "实施修正：theme-contract.test.mjs 必须在本卡内重写（它硬编码了 muse-theme.css / modules/assistant-home.css 等已归档路径，归档即报错）—— 改为递归扫描活样式表，不再写死文件路径"
        - "src/_legacy-ui/README.md：写明这是旧 UI 快照、不参与构建、IDE 报红属正常"
        - "apps/app/tsconfig.json exclude src/_legacy-ui"
        - "归档只测旧结构关系的测试：test/composition-boundary.test.mjs、test/ui-registry.test.mjs"
      out: ["改写任何旧代码（归档件保持原样）", "删除 themes/tokens.css"]
    constraints:
      - "本卡与 UI-02 必须同批交付：单独归档会让 App 起不来"
      - "归档件不得被 src/**（_legacy-ui 之外）import"
    forbidden: ["直接把旧代码删掉（要求保留可查阅形态）", "在 _legacy-ui 里继续开发"]
    acceptance:
      - {type: command, run: "pnpm run typecheck:mindlink"}
      - {type: command, run: "pnpm -F @mindlink-agent/app build"}
      - {type: assertion, expect: "src/_legacy-ui/README.md 存在且写明非构建件；tsconfig exclude 生效（归档件报错不阻断 typecheck）"}
    dependencies: []
    risk_level: L2
    touches:
      - "apps/app/src/_legacy-ui/**"
      - "apps/app/tsconfig.json"
      - "apps/app/test/_legacy/**"
      - "apps/app/test/theme-contract.test.mjs"
    result:
      branch: "ui/rebuild"
      verified_at: "2026-10-14"
      evidence:
        - "git 识别为一批重命名（R），归档件历史保留，可随时 git show 查阅"
        - "pnpm run typecheck:mindlink 全 8 包 Done；apps/app 归档后不再出现 ../emo.js 之类断链"
        - "pnpm -F @mindlink-agent/app build 通过：162 模块 / 265 kB（旧 UI 已不在 bundle 内）"
        - "新增 test/no-legacy-imports.test.mjs：断言活代码不引用归档区、且 tsconfig 已 exclude"
        - "独立脚本核过活代码 113 个相对导入全部可解析（grep 会漏，见 pitfall）"
      pitfalls:
        - "按模块名 grep 找'谁引用了被搬走的文件'会漏：shared/brand-showcase.tsx 引用 ../emo.js 就是漏网的第一例。改用导入说明符逐条解析（脚本 check-imports.py）"
      note: "已并入 main"

  - id: UI-02
    title: "立起新骨架：shell 容器 + 上下左右四栏 + workbench 槽位"
    status: done
    goal: "只搭结构，不含任何业务内容；四栏之间互不影响，窗口任意缩放不破版。"
    scope:
      in:
        - "src/shell/index.tsx + src/shell/layout.css：grid-template-areas 舞台（top/left/workbench/right/bottom）"
        - "src/top-bar/index.tsx + styles.css、src/bottom-bar/**、src/left-bar/**、src/right-bar/**"
        - "src/workbench/index.tsx：空白网格容器（画布引擎见 UI-08）"
        - "src/main.tsx 改写：只挂 shell"
        - "新增 test/shell-layout.test.mjs（断言四个栏与 workbench 槽都在）、test/no-legacy-imports.test.mjs"
      out: ["任何页面内容、任何语言文案、任何主题调色板"]
    constraints: ["栏与画布之间只通过 shell 的槽位组合，栏之间不得互相 import", "窗口最小尺寸下仍可用"]
    forbidden: ["在栏里直接写业务逻辑", "把 bar 塞进 workbench 的槽位"]
    acceptance:
      - {type: command, run: "pnpm -F @mindlink-agent/app build"}
      - {type: command, run: "node --test apps/app/test/shell-layout.test.mjs apps/app/test/no-legacy-imports.test.mjs"}
      - {type: assertion, expect: "pnpm dev 起得来；四栏与中槽可见；窗口从最小尺寸拉到最大不出现重叠/裁切"}
    dependencies: []
    risk_level: L2
    touches: ["apps/app/src/main.tsx", "apps/app/src/shell/**", "apps/app/src/{top,bottom,left,right}-bar/**", "apps/app/src/workbench/**", "apps/app/src/shared/ui-destination.ts", "apps/app/test/shell-layout.test.mjs", "apps/app/test/no-legacy-imports.test.mjs"]
    result:
      branch: "ui/rebuild"
      verified_at: "2026-10-14"
      evidence:
        - "test/shell-layout.test.mjs 5 条断言全绿：舞台声明 grid-template-areas、四条栏与画布互不 import、各自持有样式表、画布背景走 --yp-canvas-grid、shell 挂齐五个槽位"
        - "真机几何（Electron 探针，非浏览器模拟）：1426x838 / 1010x638 / 466x538 / 2546x1378 四种视口下，四栏四边贴齐、与画布无缝、无重叠、无滚动条，全部通过"
        - "截图 1338x786 采样到 6 种颜色（含分隔线灰），确认是真绘制而非空页"
        - "apps/app 测试 48 用例 / 47 通过 / 1 失败：失败项与改前基线同为 message-content（既有问题，与本次无关）"
      pitfalls:
        - "height:100vh 叠加 body 默认外边距会让页面高出视口 16px、冒出滚动条并把四栏整体内缩 8px —— 必须用 html/body/#root height:100% + margin:0 + overflow:hidden，并补 box-sizing:border-box"
        - "Electron 探针会复用磁盘缓存的旧 index.html/CSS，量到的是修复前的假象 —— 探针必须用内存分区（partition 不带 persist: 前缀）并加缓存穿透参数，否则结论是假的"
      note: "已并入 main"

  - id: UI-03
    title: "窗口控制桥与无边框窗口（唯一改动桌面壳的一刀）"
    status: done
    goal: "让上栏能自绘最小化/最大化/关闭，并保持拖拽、双击最大化、平台差异正确。"
    scope:
      in:
        - "packages/mindlink-protocol/src/index.ts：DesktopBridge 增 minimizeWindow/toggleMaximizeWindow/closeWindow/isWindowMaximized/onWindowMaximizeChanged"
        - "apps/desktop/src/preload.ts：桥方法"
        - "apps/desktop/src/main.ts：对应 ipcMain.handle（全部走 trustedHandler）；createWindow 改 frame:false(win)、保留 hiddenInset(mac)；转发 maximize/unmaximize 事件"
        - "src/top-bar：三个按钮 + -webkit-app-region: drag / no-drag 分区"
      out: ["标签页逻辑（属 UI-04）"]
    constraints: ["桥方法数会从 87 变为 90+，须同步更新协议类型与相关断言", "mac 不画自绘按钮，使用系统红绿灯"]
    forbidden: ["绕过 trustedHandler 直接注册 IPC", "在 renderer 里用 window.close() 之类的浏览器 API 冒充窗口控制"]
    acceptance:
      - {type: command, run: "pnpm run typecheck:mindlink"}
      - {type: assertion, expect: "三个按钮真生效；双击标题栏最大化；拖拽区正确（按钮不可拖）；最大化状态变化时图标同步"}
      - {type: assertion, expect: "macOS 上不出现与系统红绿灯重复的控件"}
    dependencies: ["UI-02"]
    risk_level: L3
    touches: ["packages/mindlink-protocol/src/index.ts", "apps/desktop/src/preload.ts", "apps/desktop/src/main.ts", "apps/app/src/top-bar/**", "apps/desktop/test/window-controls.test.mjs", "apps/desktop/test/ui-rebuild-shell-probe.mjs"]
    result:
      branch: "ui/rebuild"
      verified_at: "2026-10-14"
      evidence:
        - "协议层新增 5 个方法（minimizeWindow / toggleMaximizeWindow / closeWindow / isWindowMaximized / onWindowMaximizeChanged），桥方法数 87 → 91"
        - "apps/desktop/test/window-controls.test.mjs 5 条全绿：协议声明齐、preload 通道映射齐、4 个通道全部走 trustedHandler、非 macOS 自绘标题栏且无 'default'、最大化事件转发到渲染层"
        - "真机探针 apps/desktop/test/ui-rebuild-shell-probe.mjs 8/8：桥方法 5/5、无边框（outer-inner=7，带系统标题栏约 39）、最大化后外框 3072x1680 = 屏幕可用区、按钮 aria-label 跟随切换（证明事件真的送到渲染层）、还原、最小化（document.visibilityState=hidden）、截图、关闭后应用退出（exitCode=0）"
        - "证据：.tasks/ui-rebuild/evidence/UI-03/（截图 + results.md）"
      pitfalls:
        - "真机探针必须传独立 --user-data-dir：默认 userData 上只要有另一个实例或残留实例锁，新实例会被 requestSingleInstanceLock 挡掉，**秒退且没有任何输出**，看起来像崩溃"
        - "Electron 没实现 CDP 的 Browser 域（页面会话与浏览器级连接都报 \"'Browser.getWindowForTarget' wasn't found\"），读窗口状态要用渲染层可观测信号：最大化看外框尺寸是否等于 screen.availWidth/availHeight，最小化看 document.visibilityState"
        - "本机没装 playwright，仓库既有探针用的 chromium.connectOverCDP 跑不了 —— 用 Node 内置 WebSocket 写最小 CDP 客户端（Runtime.evaluate + Page.captureScreenshot）即可"
      note: "已并入 main；macOS 红绿灯行为无法在本机验证"

  - id: UI-04
    title: "上栏内容：标签页 + 窗口按钮"
    status: done
    goal: "标签页与窗口按钮共存，且不抢拖拽区。"
    scope:
      in: ["src/top-bar/：标签页模型（先做占位数据）、标签切换、与窗口按钮的布局分区"]
      out: ["标签页与 chatbox/布局的联动（后续卡）", "多标签持久化"]
    constraints: ["文案先走占位常量，等 UI-15 接 languages"]
    forbidden: ["把标签页状态塞进 workbench（标签是窗口级的）"]
    acceptance:
      - {type: command, run: "pnpm -F @mindlink-agent/app build"}
      - {type: assertion, expect: "标签可切换且高亮正确；窗口按钮与标签互不遮挡；空白处可拖动窗口"}
    dependencies: ["UI-02", "UI-03"]
    risk_level: L2
    touches: ["apps/app/src/top-bar/**", "apps/app/test/top-bar.test.mjs"]
    result:
      branch: "ui/rebuild"
      verified_at: "2026-10-14"
      evidence:
        - "apps/app/test/top-bar.test.mjs 6 条全绿：标签去重/关闭/关当前标签后取右邻再取左邻、上栏渲染标签条与窗口按钮、窗口按钮调 5 个桥方法且 macOS 整块不渲染、拖拽区不含可点元素、三个动作都有 data-window-action 供探针定位"
        - "真机截图（1.25 倍 DPI，1424x918）：上栏「Work ×」「Assistant」两个标签 + 右上三个窗口按钮；四栏与画布齐全、无重叠/裁切/滚动条"
        - "apps/app 测试 54 用例 / 53 通过 / 1 失败，失败项仍为既有的 message-content"
      decisions:
        - "一个标签 = 画布上的一份布局（tab id 即 layout id）：左栏点入口 → 打开/切换到对应标签，与'读布局文件摆 widget'是同一件事"
        - "标签状态目前由 top-bar 自持；UI-05/UI-09 接入后提到 shell 统一持有（跨栏协作不许栏之间互相 import）"
        - "标签文案是占位常量（Work/Assistant），字段已按 labelKey 设计，UI-15 抽语言包时机械替换"
        - "窗口按钮用自绘 SVG（AppIcon 里没有最小化/最大化/关闭字形），不扩展共享图标资产"
        - "macOS 让位（2026-10-15 补）：平台判定统一在 shared/platform.ts，首屏前写 <html data-os>；CSS 在 [data-os='mac'] 下把标签条左内缩设为 112px（win/linux 为 8px）；主进程 hiddenInset 配 trafficLightPosition { x: 16, y: 14 } 与之对齐。旧壳原本有同样处理（.window-controls-space 100px + chat-header 左内缩 112px），重构时一度丢掉，已补回"
      pitfalls:
        - "跨层常量必须机核：'主进程放灯的位置'与'渲染层预留的让位宽度'分处两个文件，靠人眼对不上 —— 本次就是靠交叉校验发现旧让位被丢掉的，现在每次测试都会断言 x+52 <= 让位宽度且灯在上栏里垂直居中"
      design_notes:
        - ".tasks/ui-rebuild/design/mac-topbar.html：mac 让位前后的上栏示意图（含 Windows 对照），用于讲解而非真机截图"
      note: "已并入 main；macOS 红绿灯实际位置与全屏/双击缩放/Dock 图标仍无法在 Windows 本机验证"

  - id: UI-05
    title: "左栏内容：Wiki / 技能与工具 / 设置 + pin 区"
    status: done
    goal: "左栏放固定入口与用户 pin 的 dashboard 入口；点击切换的是 workbench 布局，不是整页。"
    scope:
      in: ["src/left-bar/：固定入口按钮、pin 区渲染、pin 的增删排序", "pin/布局的存储接口（渲染层只调接口，不直接读写 localStorage）"]
      out: ["布局文件解析与渲染（UI-09）", "widget 体系（UI-16）"]
    constraints: ["存储接口按“将来搬到 Runtime 侧”设计（用户资产、可导出、跨设备）"]
    forbidden: ["把页面整页挂在左栏里", "直接依赖 window.mindlink 之外的存储细节"]
