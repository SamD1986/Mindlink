      out: ["标签页与 chatbox/布局的联动（后续卡）", "多标签持久化"]
    constraints: ["文案先走占位常量，等 UI-15 接 languages"]
    forbidden: ["把标签页状态塞进 workbench（标签是窗口级的）"]
    acceptance:
