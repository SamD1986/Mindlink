  # ───────────────────── 阶段 2：workbench 画布 ─────────────────────
  - id: UI-08
    title: "workbench 网格引擎：格坐标 + 基准 → 比例换算、吸附、背景色"
    status: pending
    goal: "把“5×5px 网格”实现为基准吸附粒度 + 比例布局，保证不同窗口尺寸下相对位置稳定。"
    scope:
      in: ["src/workbench/grid/：坐标换算、5px 基准吸附、resize 按比例重排、越界/最小尺寸处理", "网格背景色接入主题 token（复用现有 --yp-canvas-grid 语义）"]
      out: ["布局文件格式与加载（UI-09）", "widget 渲染（UI-16）"]
    constraints:
      - "网格必须用相对单位/比例，不得硬编码 px：界面字号缩放（--yp-font-scale-ui）不得让网格与文字错位"
      - "布局文件存格坐标 + 基准列数（如 96×54），像素由画布尺寸换算"
