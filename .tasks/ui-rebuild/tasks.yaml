      - {type: assertion, expect: "标签可切换且高亮正确；窗口按钮与标签互不遮挡；空白处可拖动窗口"}
    dependencies: ["UI-02", "UI-03"]
    risk_level: L2
    touches: ["apps/app/src/top-bar/**", "apps/app/test/top-bar.test.mjs"]
    result:
      branch: "ui/rebuild"
      verified_at: "2026-10-14"
      evidence:
        - "apps/app/test/top-bar.test.mjs 6 条全绿：标签去重/关闭/关当前标签后取右邻再取左邻、上栏渲染标签条与窗口按钮、窗口按钮调 5 个桥方法且 macOS 整块不渲染、拖拽区不含可点元素、三个动作都有 data-window-action 供探针定位"
        - "真机截图（1.25 倍 DPI，1424x918）：上栏「Work ×」「Assistant」两个标签 + 右上三个窗口按钮；四栏与画布齐全、无重叠/裁切/滚动条"
        - "apps/app 测试 54 用例 / 53 通过 / 1 失败，失败项仍为既有的 message-content"
      decisions:
        - "一个标签 = 画布上的一份布局（tab id 即 layout id）：左栏点入口 → 打开/切换到对应标签，与'读布局文件摆 widget'是同一件事"
        - "标签状态目前由 top-bar 自持；UI-05/UI-09 接入后提到 shell 统一持有（跨栏协作不许栏之间互相 import）"
        - "标签文案是占位常量（Work/Assistant），字段已按 labelKey 设计，UI-15 抽语言包时机械替换"
        - "窗口按钮用自绘 SVG（AppIcon 里没有最小化/最大化/关闭字形），不扩展共享图标资产"
      note: "未并入 main"

  - id: UI-05
    title: "左栏内容：Wiki / 技能与工具 / 设置 + pin 区"
    status: in_progress
    goal: "左栏放固定入口与用户 pin 的 dashboard 入口；点击切换的是 workbench 布局，不是整页。"
    scope:
      in: ["src/left-bar/：固定入口按钮、pin 区渲染、pin 的增删排序", "pin/布局的存储接口（渲染层只调接口，不直接读写 localStorage）"]
      out: ["布局文件解析与渲染（UI-09）", "widget 体系（UI-16）"]
    constraints: ["存储接口按“将来搬到 Runtime 侧”设计（用户资产、可导出、跨设备）"]
    forbidden: ["把页面整页挂在左栏里", "直接依赖 window.mindlink 之外的存储细节"]
    acceptance:
      - {type: command, run: "node --test apps/app/test/left-bar.test.mjs"}
      - {type: assertion, expect: "pin 一条后重启仍存在；点击入口切换的是布局标识（可在 UI-09 接入后验证）"}
    dependencies: ["UI-02"]
    risk_level: L2
    touches: ["apps/app/src/left-bar/**", "apps/app/src/shell/workspace.tsx", "apps/app/src/shell/workspace-model.ts", "apps/app/test/left-bar.test.mjs", "apps/app/test/workspace.test.mjs"]
    result:
      branch: "ui/rebuild"
      verified_at: "2026-10-14"
      evidence:
        - "左栏三项固定入口（wiki / skills / settings）+ pin 区 + 「固定当前布局」；pin 支持增、删、上移、下移"
        - "apps/app/test/left-bar.test.mjs 4 条 + workspace.test.mjs 7 条全绿（含布局去重/关当前标签取右邻再取左邻、pin 越界不动、存储损坏退化成空列表）"
        - "真机探针：点左栏 wiki/skills → 上栏真的开出两个标签且点谁谁成为当前；pin 落盘 localStorage=[\"skills\"]，**重载后 pin 区仍在（pin 数=1）**"
        - "机核守住'组件不碰存储'：断言 index.tsx 里不出现 localStorage，存储只实现在 entries.ts 的接缝里"
      decisions:
        - "pin/布局是**用户资产**，最终要跨设备，因此存储做成接缝 `LayoutPinStore`；当前是 localStorage 过渡实现，UI-09/UI-17 换成经桥走 Runtime（MINDLINK_HOME）时只替换实现，组件与模型不动"
        - "跨栏协作（左栏开标签）走 shell 的窗口状态通道，左栏不 import 上栏 —— 为此把标签模型从 top-bar 迁到 shell/workspace-model.ts"
      known_gaps:
        - "重载后 pin 项的显示名会回落到布局 id（如 'skills'），因为布局标题要等 UI-09 的布局登记表提供；UI-09 接入时一并解决"
        - "pin 项统一用书签图标，尚未按布局各自的图标显示（同 UI-09）"
      note: "未并入 main"

